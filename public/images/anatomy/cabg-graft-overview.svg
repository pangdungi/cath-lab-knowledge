  <text x="248" y="198" font-family="Arial, sans-serif" font-size="9" fill="#854d0e">stenosis</text>

  <path d="M156 120 C170 140 200 160 240 175" fill="none" stroke="#0d9488" stroke-width="6" stroke-linecap="round"/>
