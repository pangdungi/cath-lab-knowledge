  <text x="492" y="450" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">Leg SVG</text>
  <text x="500" y="505" font-family="Arial, sans-serif" font-size="10" fill="#1e40af">Saphenous vein to RCA / OM</text>

  <path d="M720 120 C640 150 520 200 360 230" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 3"/>
  <rect x="700" y="90" width="90" height="50" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
