  <text x="540" y="278" font-family="Arial, sans-serif" font-size="11" fill="#475569">LITA to LAD (gold standard)</text>
  <text x="540" y="298" font-family="Arial, sans-serif" font-size="11" fill="#475569">SVG / Radial to RCA, OM, PDA</text>
  <text x="540" y="318" font-family="Arial, sans-serif" font-size="11" fill="#475569">RITA to RCA or lateral wall</text>
