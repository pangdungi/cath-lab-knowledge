<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="CABG graft patency comparison">
  <rect width="960" height="420" fill="#f8fafc"/>
  <text x="24" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">CABG Graft Patency and Anatomy</text>
  <text x="24" y="58" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Why arterial conduits outperform vein grafts over time</text>

  <text x="44" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">10-year patency (approximate)</text>
  <text x="60" y="140" font-family="Arial, sans-serif" font-size="12" fill="#334155">LITA to LAD</text>
  <rect x="200" y="124" width="520" height="22" rx="6" fill="#e2e8f0"/>
  <rect x="200" y="124" width="494" height="22" rx="6" fill="#0d9488"/>
  <text x="730" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0f766e">~95%</text>
  <text x="60" y="180" font-family="Arial, sans-serif" font-size="12" fill="#334155">Radial artery</text>
  <rect x="200" y="164" width="520" height="22" rx="6" fill="#e2e8f0"/>
  <rect x="200" y="164" width="442" height="22" rx="6" fill="#7c3aed"/>
  <text x="730" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">~85%</text>
  <text x="60" y="220" font-family="Arial, sans-serif" font-size="12" fill="#334155">SVG (vein)</text>
  <rect x="200" y="204" width="520" height="22" rx="6" fill="#e2e8f0"/>
  <rect x="200" y="204" width="270" height="22" rx="6" fill="#2563eb"/>
  <text x="730" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">~50%</text>

  <rect x="24" y="250" width="912" height="150" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="44" y="280" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Wall structure and clinical meaning</text>
  <text x="44" y="310" font-weight="700" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Graft</text>
  <text x="180" y="310" font-weight="700" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Type</text>
  <text x="360" y="310" font-weight="700" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Key anatomy</text>
  <text x="640" y="310" font-weight="700" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Clinical note</text>
  <line x1="44" y1="318" x2="920" y2="318" stroke="#e2e8f0"/>
  <text x="44" y="342" font-weight="700" font-family="Arial, sans-serif" font-size="11" fill="#0f766e">LITA/RITA</text>
  <text x="180" y="342" font-family="Arial, sans-serif" font-size="11" fill="#334155">Artery in-situ</text>
  <text x="360" y="342" font-family="Arial, sans-serif" font-size="11" fill="#334155">Endothelium intact</text>
  <text x="640" y="342" font-family="Arial, sans-serif" font-size="11" fill="#334155">Low restenosis, preferred for LAD</text>
  <text x="44" y="368" font-weight="700" font-family="Arial, sans-serif" font-size="11" fill="#6d28d9">Radial</text>
  <text x="180" y="368" font-family="Arial, sans-serif" font-size="11" fill="#334155">Artery free</text>
  <text x="360" y="368" font-family="Arial, sans-serif" font-size="11" fill="#334155">Prone to spasm</text>
  <text x="640" y="368" font-family="Arial, sans-serif" font-size="11" fill="#334155">CCB post-op, Allen test</text>
  <text x="44" y="394" font-weight="700" font-family="Arial, sans-serif" font-size="11" fill="#1d4ed8">SVG</text>
  <text x="180" y="394" font-family="Arial, sans-serif" font-size="11" fill="#334155">Vein free</text>
  <text x="360" y="394" font-family="Arial, sans-serif" font-size="11" fill="#334155">Adapts to arterial pressure</text>
  <text x="640" y="394" font-family="Arial, sans-serif" font-size="11" fill="#334155">Accelerated atherosclerosis</text>
</svg>
