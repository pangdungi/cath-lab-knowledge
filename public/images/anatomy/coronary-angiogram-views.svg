<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-label="Coronary angiogram standard views">
  <rect width="1100" height="520" fill="#0f172a"/>
  <text x="24" y="36" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Cath Lab Angiographic Views</text>
  <text x="24" y="60" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">How the left and right coronary systems look on fluoroscopy (schematic)</text>

  <!-- LAO Left system -->
  <rect x="24" y="80" width="510" height="400" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="44" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">LAO view — Left Coronary System</text>
  <text x="44" y="132" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Left Anterior Oblique (catheter/spine on RIGHT of screen)</text>

  <circle cx="280" cy="250" r="8" fill="#fbbf24"/>
  <text x="292" y="254" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fde68a">LM</text>
  <text x="292" y="270" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Left Main</text>

  <path d="M280 258 L280 360" fill="none" stroke="#ef4444" stroke-width="10" stroke-linecap="round"/>
  <text x="292" y="310" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fecaca">LAD</text>
  <text x="292" y="328" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">down the front (AP groove)</text>
  <text x="292" y="380" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">pLAD · mLAD · dLAD</text>

  <path d="M272 250 C210 235 150 220 100 210" fill="none" stroke="#f87171" stroke-width="9" stroke-linecap="round"/>
  <text x="44" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fecaca">LCX</text>
  <text x="44" y="221" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">circumflex / lateral</text>

  <path d="M250 248 C210 200 175 165 140 135" fill="none" stroke="#fb7185" stroke-width="6" stroke-linecap="round"/>
  <text x="44" y="145" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fda4af">D1</text>
  <text x="44" y="161" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Diagonal branch</text>

  <path d="M180 222 C165 280 155 330 150 380" fill="none" stroke="#fb7185" stroke-width="6" stroke-linecap="round"/>
  <text x="44" y="385" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fda4af">OM1</text>
  <text x="44" y="401" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Obtuse marginal</text>

  <path d="M300 285 L335 290" fill="none" stroke="#fdba74" stroke-width="4" stroke-linecap="round"/>
  <text x="342" y="294" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fdba74">S1</text>

  <!-- RAO Right system -->
  <rect x="566" y="80" width="510" height="400" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="586" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">RAO view — Right Coronary System</text>
  <text x="586" y="132" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Right Anterior Oblique (catheter/spine on LEFT of screen)</text>

  <path d="M820 150 C860 180 880 230 875 280 C870 330 850 370 820 400 C790 420 760 430 730 420" fill="none" stroke="#ef4444" stroke-width="10" stroke-linecap="round"/>
  <text x="890" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fecaca">RCA</text>
  <text x="890" y="228" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">right AV groove</text>
  <text x="890" y="300" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">pRCA · mRCA · dRCA</text>

  <path d="M855 230 L910 225" fill="none" stroke="#fb7185" stroke-width="6" stroke-linecap="round"/>
  <text x="918" y="229" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fda4af">AM</text>
  <text x="918" y="245" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Acute marginal</text>

  <circle cx="730" cy="420" r="7" fill="#fbbf24"/>
  <text x="620" y="415" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fde68a">Crux</text>
  <text x="620" y="431" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">AV groove crossing</text>

  <path d="M730 420 C700 440 670 450 640 445" fill="none" stroke="#f97316" stroke-width="7" stroke-linecap="round" stroke-dasharray="10 5"/>
  <text x="586" y="455" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fdba74">PDA</text>
  <text x="586" y="471" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Posterior descending (right dominant)</text>

  <path d="M760 400 C790 390 820 375 845 355" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <text x="852" y="358" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fda4af">PLB</text>

  <text x="24" y="505" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Tip: LAO = spine on right · RAO = spine on left · Cranial/Caudal tilt changes overlap of branches</text>
</svg>
