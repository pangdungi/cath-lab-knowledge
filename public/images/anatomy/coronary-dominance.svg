<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="Coronary dominance">
  <rect width="960" height="400" fill="#f8fafc"/>
  <text x="24" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Coronary Dominance</text>
  <text x="24" y="58" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Where PDA originates: right, left, or co-dominant</text>
  <rect x="24" y="80" width="280" height="280" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="44" y="108" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Right Dominant</text>
  <text x="44" y="128" font-family="Arial, sans-serif" font-size="12" fill="#64748b">~80%</text>
  <circle cx="164" cy="210" r="70" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
  <path d="M210 170 C250 190 270 230 260 270" fill="none" stroke="#991b1b" stroke-width="6" stroke-linecap="round"/>
  <text x="220" y="165" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#991b1b">RCA</text>
  <path d="M164 280 C140 300 120 310 100 300" fill="none" stroke="#7f1d1d" stroke-width="5" stroke-linecap="round"/>
  <text x="70" y="318" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#7f1d1d">PDA</text>
  <path d="M120 170 C90 185 70 210 60 240" fill="none" stroke="#be123c" stroke-width="5" stroke-linecap="round"/>
  <text x="44" y="250" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#be123c">LCX</text>
  <text x="44" y="330" font-family="Arial, sans-serif" font-size="11" fill="#334155">PDA from RCA</text>
  <rect x="340" y="80" width="280" height="280" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="360" y="108" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Left Dominant</text>
  <text x="360" y="128" font-family="Arial, sans-serif" font-size="12" fill="#64748b">~10%</text>
  <circle cx="480" cy="210" r="70" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
  <path d="M430 170 C390 185 360 210 350 250" fill="none" stroke="#be123c" stroke-width="6" stroke-linecap="round"/>
  <text x="350" y="265" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#be123c">LCX</text>
  <path d="M480 280 C500 300 520 310 540 300" fill="none" stroke="#7f1d1d" stroke-width="5" stroke-linecap="round"/>
  <text x="548" y="318" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#7f1d1d">PDA</text>
  <path d="M530 170 C560 190 580 220 575 255" fill="none" stroke="#991b1b" stroke-width="5" stroke-linecap="round"/>
  <text x="560" y="165" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#991b1b">RCA</text>
  <text x="360" y="330" font-family="Arial, sans-serif" font-size="11" fill="#334155">PDA from LCX</text>
  <rect x="656" y="80" width="280" height="280" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="676" y="108" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Co-dominant</text>
  <text x="676" y="128" font-family="Arial, sans-serif" font-size="12" fill="#64748b">~10%</text>
  <circle cx="796" cy="210" r="70" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
  <path d="M750 170 C710 185 680 210 670 250" fill="none" stroke="#be123c" stroke-width="5" stroke-linecap="round"/>
  <path d="M840 170 C870 190 890 220 885 255" fill="none" stroke="#991b1b" stroke-width="5" stroke-linecap="round"/>
  <path d="M770 280 C785 295 796 305 810 295" fill="none" stroke="#7f1d1d" stroke-width="4" stroke-linecap="round"/>
  <path d="M822 280 C810 295 800 305 786 295" fill="none" stroke="#7f1d1d" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 3"/>
  <text x="676" y="330" font-family="Arial, sans-serif" font-size="11" fill="#334155">RCA and LCX both supply PDA</text>
</svg>
