<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-label="Coronary artery anatomy">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#f8fafc"/>
  <text x="24" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Coronary Artery Anatomy</text>
  <text x="24" y="58" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Major vessels - anterior view (schematic)</text>
  <path d="M480 95 C420 95 360 130 330 190 C300 250 310 330 360 390 C400 440 450 470 480 500 C510 470 560 440 600 390 C650 330 660 250 630 190 C600 130 540 95 480 95 Z" fill="#fee2e2" stroke="#f87171" stroke-width="3"/>
  <text x="455" y="300" font-family="Arial, sans-serif" font-size="14" fill="#991b1b" font-weight="700">Heart</text>
  <path d="M430 70 C430 40 530 40 530 70 L530 110 C530 125 515 130 480 130 C445 130 430 125 430 110 Z" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="448" y="92" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#7f1d1d">Aorta</text>
  <path d="M455 130 C430 145 410 165 395 190" fill="none" stroke="#b91c1c" stroke-width="7" stroke-linecap="round"/>
  <line x1="395" y1="190" x2="300" y2="155" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="120" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">LM (Left Main)</text>
  <text x="120" y="168" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Left main coronary artery</text>
  <path d="M395 190 C400 230 410 290 420 350 C425 390 435 430 445 470" fill="none" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
  <line x1="420" y1="290" x2="250" y2="250" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="60" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">LAD</text>
  <text x="60" y="263" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Left anterior descending</text>
  <path d="M405 220 C360 210 310 205 260 210" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
  <line x1="280" y1="208" x2="200" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="60" y="178" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">D1 (Diagonal)</text>
  <text x="60" y="194" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Branch of LAD</text>
  <path d="M418 300 L455 305" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
  <line x1="455" y1="305" x2="520" y2="285" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="530" y="282" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Septal (S1)</text>
  <text x="530" y="298" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Septal perforator</text>
  <path d="M395 190 C360 200 300 215 240 235 C200 248 170 270 155 300" fill="none" stroke="#be123c" stroke-width="7" stroke-linecap="round"/>
  <line x1="200" y1="248" x2="80" y2="320" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="40" y="318" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">LCX</text>
  <text x="40" y="336" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Left circumflex</text>
  <path d="M240 235 C220 270 205 310 195 350" fill="none" stroke="#e11d48" stroke-width="5" stroke-linecap="round"/>
  <line x1="200" y1="330" x2="120" y2="390" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="40" y="388" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">OM1</text>
  <text x="40" y="404" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Obtuse marginal</text>
  <path d="M530 130 C580 150 630 190 660 240 C680 280 685 330 670 380 C655 420 630 450 600 470" fill="none" stroke="#991b1b" stroke-width="8" stroke-linecap="round"/>
  <line x1="660" y1="240" x2="760" y2="210" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="770" y="208" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">RCA</text>
  <text x="770" y="226" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Right coronary artery</text>
  <path d="M640 260 C680 255 720 250 760 248" fill="none" stroke="#b91c1c" stroke-width="5" stroke-linecap="round"/>
  <line x1="720" y1="250" x2="800" y2="270" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="810" y="268" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">AM</text>
  <text x="810" y="284" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Acute marginal</text>
  <path d="M600 470 C560 490 520 500 480 505 C440 500 400 485 370 460" fill="none" stroke="#7f1d1d" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 4"/>
  <line x1="480" y1="505" x2="480" y2="560" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="575" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">PDA</text>
  <text x="400" y="593" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Posterior descending (usually RCA)</text>
  <rect x="24" y="520" width="912" height="82" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="40" y="545" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">Common abbreviations in cath lab</text>
  <text x="40" y="568" font-family="Arial, sans-serif" font-size="11" fill="#475569">LM · LAD · LCX · RCA · D (diagonal) · OM (obtuse marginal) · PDA · PLB</text>
  <text x="40" y="588" font-family="Arial, sans-serif" font-size="11" fill="#475569">pLAD / mLAD / dLAD = proximal / mid / distal LAD</text>
</svg>
