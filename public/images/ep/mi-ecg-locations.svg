<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-label="Myocardial infarction location and ECG leads">
  <rect width="960" height="520" fill="#fafafa"/>
  <text x="24" y="32" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">STEMI Location ’ ECG Leads</text>
  <text x="24" y="54" font-family="Arial, sans-serif" font-size="13" fill="#64748b">ST elevation in contiguous leads suggests infarct territory · correlate with coronary artery</text>

  <!-- Heart schematic -->
  <ellipse cx="200" cy="250" rx="120" ry="140" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
  <text x="155" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#be123c">LV</text>

  <!-- Territories -->
  <path d="M 160 130 L 240 130 L 230 200 L 150 200 Z" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="168" y="168" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#991b1b">Anterior</text>
  <text x="168" y="184" font-family="Arial, sans-serif" font-size="10" fill="#7f1d1d">V1-V4</text>

  <path d="M 120 200 L 150 200 L 160 280 L 130 300 Z" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="118" y="248" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#9a3412">Septal</text>
  <text x="118" y="262" font-family="Arial, sans-serif" font-size="9" fill="#7c2d12">V1-V2</text>

  <path d="M 230 200 L 280 210 L 270 320 L 220 310 Z" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="228" y="255" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">Lateral</text>
  <text x="222" y="271" font-family="Arial, sans-serif" font-size="10" fill="#1e3a8a">I,aVL,V5-V6</text>

  <path d="M 160 300 L 220 310 L 210 370 L 150 360 Z" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="158" y="338" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#15803d">Inferior</text>
  <text x="152" y="354" font-family="Arial, sans-serif" font-size="10" fill="#14532d">II,III,aVF</text>

  <path d="M 100 220 L 130 200 L 130 300 L 100 310 Z" fill="#e9d5ff" stroke="#9333ea" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="52" y="255" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#7e22ce">Posterior</text>
  <text x="36" y="271" font-family="Arial, sans-serif" font-size="9" fill="#581c87">V7-V9 / V1-V3 ST“</text>

  <!-- Artery labels -->
  <text x="120" y="400" font-family="Arial, sans-serif" font-size="11" fill="#475569">LAD ’ Anterior / Septal</text>
  <text x="120" y="418" font-family="Arial, sans-serif" font-size="11" fill="#475569">RCA ’ Inferior (+RV, Posterior)</text>
  <text x="120" y="436" font-family="Arial, sans-serif" font-size="11" fill="#475569">LCx ’ Lateral / Posterior</text>

  <!-- Lead panels -->
  <rect x="360" y="80" width="560" height="400" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="380" y="110" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Lead changes by territory</text>

  <g font-family="Arial, sans-serif" font-size="12">
    <rect x="380" y="130" width="520" height="52" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="396" y="152" font-weight="700" fill="#991b1b">Anterior STEMI</text>
    <text x="396" y="170" fill="#7f1d1d">ST‘ V1-V4 (e2 contiguous) · reciprocal ST“ inferior · culprit: LAD</text>

    <rect x="380" y="192" width="520" height="52" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="396" y="214" font-weight="700" fill="#9a3412">Septal</text>
    <text x="396" y="232" fill="#7c2d12">ST‘ V1-V2 · often with anterior · pathological Q in V1-V2</text>

    <rect x="380" y="254" width="520" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="396" y="276" font-weight="700" fill="#1d4ed8">Lateral STEMI</text>
    <text x="396" y="294" fill="#1e3a8a">ST‘ I, aVL, V5-V6 · high lateral(I,aVL) vs low lateral(V5-V6) · LCx / diagonal</text>

    <rect x="380" y="316" width="520" height="52" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="396" y="338" font-weight="700" fill="#15803d">Inferior STEMI</text>
    <text x="396" y="356" fill="#14532d">ST‘ II, III, aVF (e2) · reciprocal ST“ lateral · RCA common · check V4R for RV MI</text>

    <rect x="380" y="378" width="520" height="52" rx="8" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="396" y="400" font-weight="700" fill="#7e22ce">Posterior STEMI</text>
    <text x="396" y="418" fill="#581c87">V1-V3 ST depression + tall R · confirm ST‘ V7-V9 · do not miss posterior leads</text>
  </g>

  <rect x="360" y="452" width="560" height="36" rx="8" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="376" y="475" font-family="Arial, sans-serif" font-size="11" fill="#0e7490">STEMI: ST‘ e1 mm in 2 contiguous leads (V2-V3: sex/age thresholds) · new LBBB = equivalent</text>
</svg>
