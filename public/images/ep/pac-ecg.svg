<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" role="img" aria-label="PAC ECG example">
  <rect width="920" height="380" fill="#fafafa"/>
  <text x="24" y="32" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">PAC (Premature Atrial Contraction) - ECG</text>
  <text x="24" y="54" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Early P' wave + usually narrow QRS + non-compensatory pause</text>

  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="24" y1="90" x2="896" y2="90"/>
    <line x1="24" y1="120" x2="896" y2="120"/>
    <line x1="24" y1="150" x2="896" y2="150"/>
    <line x1="24" y1="180" x2="896" y2="180"/>
    <line x1="24" y1="210" x2="896" y2="210"/>
    <line x1="24" y1="240" x2="896" y2="240"/>
    <line x1="24" y1="270" x2="896" y2="270"/>
  </g>
  <line x1="24" y1="210" x2="896" y2="210" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Normal beats + 1 PAC + pause + resume -->
  <polyline fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round"
    points="24,210 50,210 58,188 66,232 74,118 82,242 90,210 110,210 118,188 126,232 134,118 142,242 150,210 170,210 178,188 186,232 194,118 202,242 210,210 230,210 238,188 246,232 254,118 262,242 270,210 285,210 292,195 298,232 306,118 314,242 322,210 360,210 368,188 376,232 384,118 392,242 400,210 420,210 428,188 436,232 444,118 452,242 460,210 500,210 508,188 516,232 524,118 532,242 540,210 560,210 568,188 576,232 584,118 592,242 600,210 620,210 628,188 636,232 644,118 652,242 660,210 680,210 688,188 696,232 704,118 712,242 720,210 740,210 748,188 756,232 764,118 772,242 780,210 800,210 808,188 816,232 824,118 832,242 840,210 860,210 868,188 876,232 884,118 892,242 896,210"/>

  <!-- Early P' for PAC -->
  <circle cx="292" cy="195" r="5" fill="#ea580c" stroke="#c2410c" stroke-width="1.5"/>
  <text x="278" y="182" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#c2410c">P'</text>

  <!-- RR markers -->
  <line x1="150" y1="300" x2="270" y2="300" stroke="#64748b" stroke-width="2"/>
  <text x="175" y="318" font-family="Arial, sans-serif" font-size="11" fill="#475569">normal RR</text>
  <line x1="270" y1="300" x2="322" y2="300" stroke="#ea580c" stroke-width="2"/>
  <text x="276" y="318" font-family="Arial, sans-serif" font-size="11" fill="#c2410c">short RR (early)</text>
  <line x1="322" y1="300" x2="500" y2="300" stroke="#6366f1" stroke-width="2"/>
  <text x="360" y="318" font-family="Arial, sans-serif" font-size="11" fill="#4338ca">pause (often non-compensatory)</text>

  <!-- Labels on waveform -->
  <text x="118" y="105" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0f766e">P</text>
  <text x="134" y="105" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0f766e">QRS</text>
  <text x="306" y="105" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0f766e">QRS</text>
  <text x="430" y="105" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0f766e">P</text>

  <rect x="24" y="330" width="872" height="42" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="40" y="356" font-family="Arial, sans-serif" font-size="11" fill="#9a3412">Look for: early P' (different shape) · narrow QRS · pause after PAC · frequent PACs after AF cardioversion</text>
</svg>
