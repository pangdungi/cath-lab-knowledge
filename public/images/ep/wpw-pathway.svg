<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-label="WPW accessory pathway">
  <rect width="920" height="420" fill="#f8fafc"/>
  <text x="24" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">WPW: Accessory Pathway (Kent bundle)</text>
  <text x="24" y="58" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Normal conduction vs shortcut that pre-excites the ventricles</text>

  <!-- Atria -->
  <rect x="80" y="90" width="760" height="70" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="132" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">Atria (심방)</text>

  <!-- Ventricles -->
  <rect x="80" y="250" width="760" height="90" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="390" y="302" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#b91c1c">Ventricles (심실)</text>

  <!-- AV node -->
  <rect x="410" y="175" width="100" height="55" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="430" y="200" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#b45309">AV node</text>
  <text x="424" y="218" font-family="Arial, sans-serif" font-size="10" fill="#92400e">(delay gate)</text>

  <!-- Normal pathway -->
  <path d="M460 160 L460 175" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#blueArr)"/>
  <path d="M460 230 L460 250" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#blueArr)"/>
  <text x="480" y="248" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">Normal path</text>
  <text x="480" y="264" font-family="Arial, sans-serif" font-size="10" fill="#475569">SA -> AV node -> His-Purkinje</text>

  <!-- Accessory pathway -->
  <path d="M700 155 C760 180 780 210 720 255" fill="none" stroke="#dc2626" stroke-width="7" stroke-linecap="round" marker-end="url(#redArr)"/>
  <text x="740" y="190" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">Accessory</text>
  <text x="740" y="206" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">pathway</text>
  <text x="740" y="222" font-family="Arial, sans-serif" font-size="10" fill="#475569">AV node bypass</text>

  <defs>
    <marker id="blueArr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="redArr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>

  <!-- Result box -->
  <rect x="24" y="360" width="872" height="48" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="40" y="388" font-family="Arial, sans-serif" font-size="11" fill="#334155">Some impulses reach ventricles early -> pre-excitation -> ECG: short PR + delta wave + wide QRS</text>

  <!-- AF danger -->
  <rect x="24" y="300" width="300" height="48" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="40" y="330" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#991b1b">WPW + AF = dangerous</text>
</svg>
