<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260">
  <rect width="700" height="260" fill="#f8fafc"/>
  <text x="24" y="28" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">TEE로 LAA Thrombus 확인 — Cardioversion 전 필수</text>
  
  <!-- 왜 확인? -->
  <rect x="30" y="50" width="200" height="190" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="50" y="78" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#dc2626">왜 확인하나?</text>
  <text x="50" y="105" font-size="9" fill="#334155">AF 중 atrium이 제대로 contract 안함</text>
  <text x="50" y="120" font-size="9" fill="#334155">↓</text>
  <text x="50" y="135" font-size="9" fill="#334155">LAA에 blood stasis</text>
  <text x="50" y="150" font-size="9" fill="#334155">↓</text>
  <text x="50" y="165" font-size="9" fill="#334155">Thrombus 형성</text>
  <text x="50" y="180" font-size="9" fill="#334155">↓</text>
  <text x="50" y="195" font-size="9" fill="#dc2626" font-weight="700">Cardioversion 시</text>
  <text x="50" y="210" font-size="9" fill="#dc2626" font-weight="700">thrombus embolization → stroke</text>
  
  <!-- TEE -->
  <rect x="250" y="50" width="220" height="190" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="270" y="78" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">TEE (Transesophageal Echo)</text>
  
  <!-- 심장 단면 -->
  <ellipse cx="360" cy="150" rx="70" ry="55" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="360" y="145" text-anchor="middle" font-size="9" fill="#1e40af">LA</text>
  <text x="360" y="158" text-anchor="middle" font-size="8" fill="#1e40af">(left atrium)</text>
  
  <!-- LAA -->
  <path d="M295 135 Q270 120 275 145 Q270 160 295 155" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
  <text x="265" y="140" font-size="7" fill="#991b1b">LAA</text>
  
  <!-- Thrombus 표시 -->
  <circle cx="283" cy="143" r="6" fill="#7f1d1d"/>
  <text x="250" y="180" font-size="8" fill="#dc2626">← thrombus?</text>
  
  <!-- Esophagus/TEE probe -->
  <rect x="400" y="100" width="8" height="80" rx="3" fill="#64748b"/>
  <text x="415" y="145" font-size="8" fill="#475569">TEE</text>
  <text x="415" y="157" font-size="8" fill="#475569">probe</text>
  
  <text x="270" y="220" font-size="9" fill="#334155">Esophagus에서 heart posterior 직접 봄</text>
  <text x="270" y="235" font-size="9" fill="#334155">→ LAA thrombus/sludge 확인</text>
  
  <!-- 결과 분기 -->
  <rect x="490" y="50" width="190" height="190" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="510" y="78" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#15803d">TEE 결과에 따라</text>
  
  <rect x="510" y="95" width="150" height="50" rx="6" fill="#dcfce7" stroke="#22c55e"/>
  <text x="585" y="115" text-anchor="middle" font-size="10" fill="#166534" font-weight="700">Thrombus 없음</text>
  <text x="585" y="132" text-anchor="middle" font-size="9" fill="#166534">→ Cardioversion 진행</text>
  
  <rect x="510" y="155" width="150" height="65" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="585" y="175" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">Thrombus 있음</text>
  <text x="585" y="192" text-anchor="middle" font-size="9" fill="#991b1b">→ 연기 + anticoag 강화</text>
  <text x="585" y="207" text-anchor="middle" font-size="9" fill="#991b1b">(3~4주 후 재확인)</text>
</svg>
