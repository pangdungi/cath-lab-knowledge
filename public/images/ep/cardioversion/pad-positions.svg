<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340">
  <rect width="720" height="340" fill="#f8fafc"/>
  <text x="24" y="28" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Pad Position — Anterior-Posterior vs Anterior-Lateral</text>
  
  <!-- AP Position -->
  <rect x="30" y="50" width="320" height="270" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="50" y="78" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">① AP (Anterior-Posterior)</text>
  <text x="50" y="98" font-size="10" fill="#64748b">AF cardioversion 성공률 약간 높음</text>
  
  <!-- Anterior -->
  <ellipse cx="130" cy="180" rx="55" ry="70" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="130" y="175" text-anchor="middle" font-size="9" fill="#92400e">Anterior</text>
  <text x="130" y="190" text-anchor="middle" font-size="8" fill="#92400e">(앞면)</text>
  <!-- Pad 1 -->
  <rect x="145" y="130" width="35" height="25" rx="4" fill="#dc2626" stroke="#991b1b"/>
  <text x="162" y="147" text-anchor="middle" font-size="7" fill="#fff">PAD</text>
  <text x="195" y="145" font-size="8" fill="#dc2626">Sternum Rt.</text>
  <text x="195" y="156" font-size="8" fill="#dc2626">or apex</text>
  
  <!-- Posterior -->
  <ellipse cx="130" cy="180" rx="45" ry="60" fill="none" stroke="#94a3b8" stroke-dasharray="4"/>
  <ellipse cx="260" cy="180" rx="55" ry="70" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="260" y="175" text-anchor="middle" font-size="9" fill="#4338ca">Posterior</text>
  <text x="260" y="190" text-anchor="middle" font-size="8" fill="#4338ca">(뒷면)</text>
  <!-- Pad 2 -->
  <rect x="220" y="200" width="35" height="25" rx="4" fill="#dc2626" stroke="#991b1b"/>
  <text x="237" y="217" text-anchor="middle" font-size="7" fill="#fff">PAD</text>
  <text x="265" y="240" font-size="8" fill="#dc2626">Lt. scapula</text>
  <text x="265" y="251" font-size="8" fill="#dc2626">아래</text>
  
  <!-- Current direction -->
  <path d="M165 155 Q200 180 235 200" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5" fill="none" marker-end="url(#bluearrow)"/>
  <defs><marker id="bluearrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/></marker></defs>
  <text x="200" y="185" font-size="8" fill="#2563eb">current</text>
  
  <text x="50" y="290" font-size="9" fill="#334155">✓ Heart 앞뒤로 current 관통</text>
  <text x="50" y="305" font-size="9" fill="#334155">✓ Atrium에 current 잘 전달</text>
  
  <!-- AL Position -->
  <rect x="370" y="50" width="330" height="270" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="390" y="78" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#b45309">② AL (Anterior-Lateral)</text>
  <text x="390" y="98" font-size="10" fill="#64748b">VT/VF defibrillation 표준 위치와 동일</text>
  
  <!-- Anterior -->
  <ellipse cx="535" cy="180" rx="80" ry="70" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="535" y="180" text-anchor="middle" font-size="9" fill="#92400e">Anterior</text>
  
  <!-- Pad 1 - Rt. clavicle -->
  <rect x="485" y="115" width="35" height="25" rx="4" fill="#dc2626" stroke="#991b1b"/>
  <text x="502" y="132" text-anchor="middle" font-size="7" fill="#fff">PAD</text>
  <text x="530" y="125" font-size="8" fill="#dc2626">Rt. clavicle 아래</text>
  
  <!-- Pad 2 - Lt. axillary -->
  <rect x="580" y="170" width="35" height="25" rx="4" fill="#dc2626" stroke="#991b1b"/>
  <text x="597" y="187" text-anchor="middle" font-size="7" fill="#fff">PAD</text>
  <text x="625" y="182" font-size="8" fill="#dc2626">Lt. mid-</text>
  <text x="625" y="193" font-size="8" fill="#dc2626">axillary</text>
  <text x="625" y="204" font-size="8" fill="#dc2626">(V5~V6)</text>
  
  <!-- Current direction -->
  <path d="M520 135 L580 175" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5" fill="none" marker-end="url(#orangearrow)"/>
  <defs><marker id="orangearrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/></marker></defs>
  <text x="555" y="148" font-size="8" fill="#b45309">current</text>
  
  <text x="390" y="290" font-size="9" fill="#334155">✓ AP positioning 어려울 때</text>
  <text x="390" y="305" font-size="9" fill="#334155">✓ VT/VF defibrillation에서도 사용</text>
</svg>
