<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280">
  <rect width="700" height="280" fill="#f8fafc"/>
  <text x="24" y="28" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Cardioversion 원리 — Synchronized Shock으로 Atrium Reset</text>
  
  <!-- AF 상태 -->
  <rect x="30" y="50" width="200" height="200" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="50" y="78" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#dc2626">AF 상태</text>
  <ellipse cx="130" cy="130" rx="60" ry="50" fill="#fee2e2" stroke="#ef4444"/>
  <text x="130" y="125" text-anchor="middle" font-size="10" fill="#991b1b">Atrium</text>
  <path d="M90 140 Q100 120 110 145 Q120 125 130 150 Q140 130 150 145 Q160 120 170 140" stroke="#dc2626" fill="none" stroke-width="2"/>
  <text x="130" y="165" text-anchor="middle" font-size="8" fill="#7f1d1d">multiple reentry</text>
  <text x="50" y="220" font-size="9" fill="#64748b">• 여러 reentry circuit 돌고 있음</text>
  <text x="50" y="235" font-size="9" fill="#64748b">• SA node가 lead 못함</text>
  
  <!-- 화살표 -->
  <path d="M240 150 L290 150" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f59e0b"/></marker></defs>
  <text x="265" y="140" text-anchor="middle" font-size="10" font-weight="700" fill="#f59e0b">Shock</text>
  <text x="265" y="175" text-anchor="middle" font-size="8" fill="#92400e">120~200 J</text>
  
  <!-- Shock 순간 -->
  <rect x="300" y="50" width="170" height="200" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="320" y="78" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#b45309">Shock 순간</text>
  <ellipse cx="385" cy="130" rx="50" ry="45" fill="#fde68a" stroke="#f59e0b"/>
  <text x="385" y="125" text-anchor="middle" font-size="9" fill="#78350f">모든 myocyte</text>
  <text x="385" y="140" text-anchor="middle" font-size="9" fill="#78350f">동시 depolarize</text>
  <text x="320" y="205" font-size="9" fill="#64748b">• Current가 atrium 관통</text>
  <text x="320" y="220" font-size="9" fill="#64748b">• 모든 reentry 끊김</text>
  <text x="320" y="235" font-size="9" fill="#64748b">• "Reset"</text>
  
  <!-- 화살표 -->
  <path d="M480 150 L520 150" stroke="#22c55e" stroke-width="3" marker-end="url(#arrow2)"/>
  <defs><marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#22c55e"/></marker></defs>
  
  <!-- Sinus -->
  <rect x="530" y="50" width="150" height="200" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="550" y="78" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#15803d">Sinus Rhythm</text>
  <ellipse cx="605" cy="130" rx="45" ry="40" fill="#dcfce7" stroke="#22c55e"/>
  <circle cx="605" cy="110" r="8" fill="#22c55e"/>
  <text x="605" y="114" text-anchor="middle" font-size="6" fill="#fff">SA</text>
  <text x="605" y="145" text-anchor="middle" font-size="9" fill="#166534">SA node가</text>
  <text x="605" y="158" text-anchor="middle" font-size="9" fill="#166534">먼저 fire</text>
  <text x="550" y="205" font-size="9" fill="#64748b">• Regular sinus rhythm</text>
  <text x="550" y="220" font-size="9" fill="#64748b">• P wave 다시 보임</text>
</svg>
