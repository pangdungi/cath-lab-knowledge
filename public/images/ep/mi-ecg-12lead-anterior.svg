<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="12-lead STEMI ECG overview">
  <rect width="960" height="420" fill="#fafafa"/>
  <text x="24" y="32" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">12-lead ECG  Anterior STEMI Ü</text>
  <text x="24" y="54" font-family="Arial, sans-serif" font-size="13" fill="#64748b">V1-V4 ST elevation (LAD occlusion pattern) · schematic rhythm strip layout</text>

  <!-- Lead rows labels -->
  <g font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">
    <text x="24" y="88">I</text><text x="24" y="128">II</text><text x="24" y="168">III</text>
    <text x="24" y="208">aVR</text><text x="24" y="248">aVL</text><text x="24" y="288">aVF</text>
    <text x="24" y="328">V1</text><text x="24" y="368">V2-V4 ‘</text>
  </g>

  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="60" y1="80" x2="920" y2="80"/><line x1="60" y1="120" x2="920" y2="120"/>
    <line x1="60" y1="160" x2="920" y2="160"/><line x1="60" y1="200" x2="920" y2="200"/>
    <line x1="60" y1="240" x2="920" y2="240"/><line x1="60" y1="280" x2="920" y2="280"/>
    <line x1="60" y1="320" x2="920" y2="320"/><line x1="60" y1="360" x2="920" y2="360"/>
  </g>

  <!-- Baselines per row -->
  <line x1="60" y1="100" x2="920" y2="100" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="60" y1="140" x2="920" y2="140" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="60" y1="180" x2="920" y2="180" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="60" y1="220" x2="920" y2="220" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="60" y1="260" x2="920" y2="260" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="60" y1="300" x2="920" y2="300" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="60" y1="340" x2="920" y2="340" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="60" y1="380" x2="920" y2="380" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Limb leads - mostly normal, inferior reciprocal ST down in II III aVF -->
  <polyline fill="none" stroke="#64748b" stroke-width="2" points="60,100 80,100 88,106 96,94 104,106 112,100 140,100 148,106 156,94 164,106 172,100 200,100"/>
  <polyline fill="none" stroke="#64748b" stroke-width="2" points="60,140 80,140 88,146 96,134 104,152 112,140 140,140 148,146 156,134 164,152 172,140 200,140"/>
  <line x1="112" y1="140" x2="140" y2="148" stroke="#6366f1" stroke-width="3"/>
  <text x="210" y="144" font-family="Arial, sans-serif" font-size="10" fill="#4338ca">II ST“ reciprocal</text>
  <polyline fill="none" stroke="#64748b" stroke-width="2" points="60,180 80,180 88,186 96,174 104,154 112,180 140,180 148,186 156,174 164,154 172,180 200,180"/>
  <line x1="112" y1="180" x2="140" y2="188" stroke="#6366f1" stroke-width="3"/>
  <text x="210" y="184" font-family="Arial, sans-serif" font-size="10" fill="#4338ca">III ST“</text>
  <polyline fill="none" stroke="#64748b" stroke-width="2" points="60,220 80,220 88,214 96,226 104,214 112,220 140,220"/>
  <polyline fill="none" stroke="#64748b" stroke-width="2" points="60,260 80,260 88,266 96,254 104,266 112,260 140,260"/>
  <polyline fill="none" stroke="#64748b" stroke-width="2" points="60,300 80,300 88,306 96,288 104,312 112,300 140,300"/>
  <line x1="112" y1="300" x2="140" y2="308" stroke="#6366f1" stroke-width="3"/>
  <text x="210" y="304" font-family="Arial, sans-serif" font-size="10" fill="#4338ca">aVF ST“</text>

  <!-- V1 mild -->
  <polyline fill="none" stroke="#64748b" stroke-width="2" points="300,340 320,340 328,346 336,330 344,350 352,340 380,340 388,346 396,330 404,350 412,340 440,340"/>
  <line x1="352" y1="340" x2="380" y2="334" stroke="#ea580c" stroke-width="3"/>

  <!-- V2-V4 strong anterior STEMI -->
  <polyline fill="none" stroke="#0f766e" stroke-width="2.5" points="460,380 480,380 488,386 496,350 504,400 512,380 540,380 548,386 556,350 564,400 572,380 600,380 608,386 616,350 624,400 632,380 660,380 668,386 676,345 684,402 692,380 720,380"/>
  <line x1="512" y1="380" x2="540" y2="362" stroke="#ea580c" stroke-width="4"/>
  <line x1="572" y1="380" x2="600" y2="358" stroke="#ea580c" stroke-width="4"/>
  <line x1="632" y1="380" x2="660" y2="355" stroke="#ea580c" stroke-width="4"/>
  <line x1="692" y1="380" x2="720" y2="352" stroke="#ea580c" stroke-width="4"/>
  <text x="740" y="384" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#991b1b">V2-V4 ST‘</text>

  <rect x="24" y="392" width="912" height="22" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="40" y="407" font-family="Arial, sans-serif" font-size="10" fill="#991b1b">Anterior STEMI: precordial ST‘ + inferior reciprocal ST“ ’ activate cath lab · suspect LAD occlusion</text>
</svg>
