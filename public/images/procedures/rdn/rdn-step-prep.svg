<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200"><rect width="600" height="200" fill="#f8fafc"/><text x="20" y="36" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">1. 시술 전 준비</text><text x="20" y="62" font-size="11" fill="#64748b">난치성 HTN · CT/MRA 신장동맥 · Spyral kit</text><rect x="20" y="78" width="560" height="100" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="36" y="105" font-size="10" fill="#334155">• 약물 3종+에도 BP↑ (resistant HTN)</text><text x="36" y="125" font-size="10" fill="#334155">• 신장동맥 Ø3~8mm · accessory renal 확인</text><text x="36" y="145" font-size="10" fill="#334155">• 금기: significant RAS · FMD · aneurysm</text><text x="36" y="165" font-size="10" fill="#334155">• Spyral catheter · G3 generator · grounding pad</text></svg>