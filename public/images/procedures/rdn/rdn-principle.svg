<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260">
<rect width="640" height="260" fill="#f8fafc"/>
<text x="20" y="32" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Renal Denervation 원리</text>
<ellipse cx="120" cy="130" rx="55" ry="70" fill="#fecaca" stroke="#ef4444"/>
<text x="120" y="135" text-anchor="middle" font-size="11" fill="#991b1b">Kidney</text>
<path d="M175 130 L260 130" stroke="#dc2626" stroke-width="8"/>
<text x="210" y="115" text-anchor="middle" font-size="10" fill="#b91c1c">Renal artery</text>
<circle cx="290" cy="130" r="22" fill="#fef3c7" stroke="#f59e0b"/>
<text x="290" y="134" text-anchor="middle" font-size="9" fill="#92400e">신경</text>
<text x="330" y="120" font-family="Arial,sans-serif" font-size="10" fill="#334155">교감신경 과활성 → BP↑</text>
<text x="330" y="140" font-family="Arial,sans-serif" font-size="10" fill="#334155">RF/초음파로 신경 절단(ablate)</text>
<text x="330" y="160" font-family="Arial,sans-serif" font-size="10" fill="#334155">→ 혈압↓ (수개월에 걸쳐)</text>
<rect x="400" y="70" width="210" height="120" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
<text x="415" y="95" font-size="11" font-weight="700" fill="#1d4ed8">비유</text>
<text x="415" y="118" font-size="10" fill="#334155">과열된 보일러(교감신경)</text>
<text x="415" y="136" font-size="10" fill="#334155">밸브를 조금 내려</text>
<text x="415" y="154" font-size="10" fill="#334155">압력(BP)을 줄이는 것</text>
</svg>