<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="CABG surgery overview">
  <rect width="960" height="480" fill="#f8fafc"/>
  <text x="24" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">CABG Surgery Overview</text>
  <text x="24" y="58" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Conduit bypassing obstructed coronary arteries</text>
  <rect x="100" y="90" width="32" height="260" rx="5" fill="#cbd5e1" stroke="#64748b"/>
  <ellipse cx="250" cy="230" rx="100" ry="120" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
  <path d="M220 140 C240 160 255 200 260 250" fill="none" stroke="#991b1b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="248" cy="195" r="9" fill="#fef08a" stroke="#ca8a04"/>
  <path d="M132 120 C160 140 190 160 225 180" fill="none" stroke="#0d9488" stroke-width="6" stroke-linecap="round"/>
  <path d="M225 180 C240 190 250 200 248 195" fill="none" stroke="#0d9488" stroke-width="6" stroke-linecap="round"/>
  <text x="40" y="115" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0f766e">LITA to LAD</text>
  <path d="M480 380 C420 340 360 290 320 260" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 4"/>
  <text x="460" y="400" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">SVG from leg</text>
  <rect x="420" y="80" width="500" height="360" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="440" y="110" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Key surgical steps</text>
  <text x="440" y="140" font-family="Arial, sans-serif" font-size="11" fill="#334155">1. Median sternotomy, CPB</text>
  <text x="440" y="162" font-family="Arial, sans-serif" font-size="11" fill="#334155">2. Harvest LITA, SVG, radial</text>
  <text x="440" y="184" font-family="Arial, sans-serif" font-size="11" fill="#334155">3. Distal anastomosis beyond stenosis</text>
  <text x="440" y="206" font-family="Arial, sans-serif" font-size="11" fill="#334155">4. SVG proximal to ascending aorta</text>
  <text x="440" y="240" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Cath lab: native + graft angiography</text>
</svg>
