<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Coronary Sinus Reducer 원리">
  <rect width="900" height="420" fill="#f8fafc"/>
  <text x="24" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Reducer가 하는 일 — 한눈에</text>
  <text x="24" y="58" font-family="Arial, sans-serif" font-size="13" fill="#64748b">혈관을 넓히는 게 아니라, 허혈 심근 쪽으로 혈을 돌려줍니다</text>
  <ellipse cx="180" cy="220" rx="90" ry="110" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
  <text x="130" y="100" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#be123c">허혈 심근</text>
  <rect x="120" y="130" width="120" height="22" rx="4" fill="#fecdd3" stroke="#f43f5e"/>
  <text x="128" y="145" font-family="Arial, sans-serif" font-size="10" fill="#9f1239">심내막(속) — 먼저 굶주림</text>
  <rect x="120" y="160" width="120" height="22" rx="4" fill="#ffe4e6" stroke="#fb7185"/>
  <text x="128" y="175" font-family="Arial, sans-serif" font-size="10" fill="#9f1239">심외막(겉) — 상대적으로 나음</text>
  <path d="M250 210 C310 210 350 200 390 185" fill="none" stroke="#991b1b" stroke-width="4"/>
  <text x="300" y="198" font-family="Arial, sans-serif" font-size="10" fill="#991b1b">관상동맥 혈류</text>
  <path d="M250 250 C320 260 360 270 420 285" fill="none" stroke="#1d4ed8" stroke-width="5"/>
  <text x="300" y="285" font-family="Arial, sans-serif" font-size="10" fill="#1d4ed8">관상정맥류(CS) — 혈이 모여 나감</text>
  <rect x="430" y="250" width="50" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <ellipse cx="455" cy="285" rx="12" ry="18" fill="#fff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="410" y="340" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">Reducer</text>
  <text x="410" y="356" font-family="Arial, sans-serif" font-size="10" fill="#334155">모래시계 모양으로 CS 좁힘</text>
  <path d="M480 285 L560 285" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1d4ed8"/></marker></defs>
  <text x="500" y="275" font-family="Arial, sans-serif" font-size="10" fill="#1d4ed8">정맥압 ↑</text>
  <rect x="580" y="120" width="280" height="220" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="600" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">비유로 이해하기</text>
  <text x="600" y="180" font-family="Arial, sans-serif" font-size="11" fill="#334155">① PCI/CABG = 막힌 길을 뚫어줌</text>
  <text x="600" y="204" font-family="Arial, sans-serif" font-size="11" fill="#334155">② Reducer = 길은 그대로, 배수구를 살짝 막아</text>
  <text x="616" y="224" font-family="Arial, sans-serif" font-size="11" fill="#334155">물(혈류)이 덜 흘러나가게 함</text>
  <text x="600" y="252" font-family="Arial, sans-serif" font-size="11" fill="#334155">③ 그러면 가장 목마른 곳(심내막)으로</text>
  <text x="616" y="272" font-family="Arial, sans-serif" font-size="11" fill="#334155">혈이 다시 분배됨 → 흉통 완화</text>
  <text x="600" y="310" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0f766e">효과는 보통 1~3개월 후 서서히 나타남</text>
</svg>
