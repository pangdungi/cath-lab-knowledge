<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-label="Reducer 배포">
  <rect width="700" height="300" fill="#f8fafc"/>
  <text x="24" y="32" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">8단계 — Reducer 배포(펼치기)</text>
  <path d="M100 180 C250 160 400 160 550 175" stroke="#1d4ed8" stroke-width="10" fill="none"/>
  <ellipse cx="350" cy="168" rx="18" ry="28" fill="#fff" stroke="#0f766e" stroke-width="4"/>
  <rect x="330" y="120" width="40" height="90" rx="6" fill="#fef08a" stroke="#ca8a04" opacity="0.7"/>
  <text x="300" y="110" font-family="Arial,sans-serif" font-size="10" fill="#ca8a04">풍선</text>
  <rect x="400" y="80" width="260" height="180" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="420" y="110" font-family="Arial,sans-serif" font-size="11" fill="#334155">· 4~6 atm으로 60초 이상</text>
  <text x="420" y="135" font-family="Arial,sans-serif" font-size="11" fill="#334155">· CS보다 10~20% 크게(oversizing)</text>
  <text x="420" y="160" font-family="Arial,sans-serif" font-size="11" fill="#334155">· radiopaque marker로 위치 확인</text>
  <text x="420" y="190" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#64748b">배포 중 일시적 부정맥 가능</text>
</svg>
