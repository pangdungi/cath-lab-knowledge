<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" role="img" aria-label="우심방압 측정">
  <rect width="700" height="280" fill="#f8fafc"/>
  <text x="24" y="32" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">3단계 — 우심방압(RA) 측정</text>
  <ellipse cx="200" cy="150" rx="70" ry="55" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
  <text x="165" y="155" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#be123c">RA</text>
  <rect x="380" y="80" width="280" height="160" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="400" y="110" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#0f172a">왜 재는가?</text>
  <text x="400" y="138" font-family="Arial,sans-serif" font-size="11" fill="#334155">RA 압이 이미 높으면(≥15)</text>
  <text x="400" y="160" font-family="Arial,sans-serif" font-size="11" fill="#334155">CS를 더 좁혀도 이득이 적음</text>
  <text x="400" y="190" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#dc2626">≥15 mmHg → 시술 중단</text>
  <text x="400" y="218" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#0f766e">&lt;15 mmHg → 다음 단계 진행</text>
</svg>
