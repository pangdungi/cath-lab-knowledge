<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-label="CS venography">
  <rect width="700" height="300" fill="#f8fafc"/>
  <text x="24" y="32" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">5단계 — CS 조영(venography)으로 위치 정하기</text>
  <path d="M120 200 C200 180 280 170 400 175 C480 178 540 190 580 210" stroke="#1d4ed8" stroke-width="8" fill="none"/>
  <circle cx="200" cy="185" r="8" fill="#fbbf24" stroke="#d97706"/>
  <text x="170" y="170" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#d97706">입구</text>
  <circle cx="380" cy="172" r="10" fill="#22c55e" stroke="#15803d"/>
  <text x="350" y="155" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#15803d">여기에 넣기!</text>
  <text x="350" y="250" font-family="Arial,sans-serif" font-size="10" fill="#334155">입구에서 1.5~3 cm 원위 · 가지혈관 피하기</text>
  <rect x="450" y="60" width="220" height="120" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="470" y="90" font-family="Arial,sans-serif" font-size="11" fill="#334155">뼈 landmark로 위치 확인</text>
  <text x="470" y="115" font-family="Arial,sans-serif" font-size="11" fill="#334155">side branch 피하기</text>
  <text x="470" y="140" font-family="Arial,sans-serif" font-size="11" fill="#334155">valve-free 구간 선택</text>
</svg>
