<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-label="관상정맥류 진입">
  <rect width="700" height="300" fill="#f8fafc"/>
  <text x="24" y="32" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">4단계 — 관상정맥류(CS) 진입</text>
  <ellipse cx="220" cy="160" rx="90" ry="70" fill="#fff1f2" stroke="#fda4af"/>
  <path d="M180 200 C200 230 240 250 280 255" stroke="#1d4ed8" stroke-width="6" fill="none"/>
  <text x="250" y="275" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">CS ostium</text>
  <rect x="380" y="80" width="280" height="180" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="400" y="110" font-family="Arial,sans-serif" font-size="11" fill="#334155">· LAO 30° 조영</text>
  <text x="400" y="135" font-family="Arial,sans-serif" font-size="11" fill="#334155">· catheter로 CS 입구 찾기</text>
  <text x="400" y="160" font-family="Arial,sans-serif" font-size="11" fill="#334155">· wire를 CS 안쪽(원위)으로</text>
  <text x="416" y="180" font-family="Arial,sans-serif" font-size="11" fill="#334155">great cardiac vein 방향으로 진행</text>
  <text x="400" y="210" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#64748b">어려우면 Amplatz Left 등 교체</text>
</svg>
