<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-label="CABG LHC radial access difficulty">
  <rect width="960" height="500" fill="#f8fafc"/>
  <text x="24" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">CABG LHC - Why Right Radial Can Be Difficult</text>
  <text x="24" y="58" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Use left radial or femoral when right radial fails</text>
  <rect x="24" y="80" width="280" height="380" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="44" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">#1 Radial graft harvest</text>
  <rect x="100" y="160" width="120" height="140" rx="30" fill="#fee2e2" stroke="#f87171"/>
  <path d="M160 175 C158 215 156 255 154 285" fill="none" stroke="#94a3b8" stroke-width="5" stroke-dasharray="6 4"/>
  <text x="72" y="340" font-family="Arial, sans-serif" font-size="10" fill="#334155">Radial artery removed for CABG</text>
  <text x="72" y="358" font-family="Arial, sans-serif" font-size="10" fill="#334155">Cannot puncture that arm</text>
  <rect x="328" y="80" width="300" height="380" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="348" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f766e">#2 LIMA angiography</text>
  <text x="348" y="340" font-family="Arial, sans-serif" font-size="10" fill="#334155">LIMA from left subclavian</text>
  <text x="348" y="358" font-family="Arial, sans-serif" font-size="10" fill="#334155">Selective cath harder from right radial</text>
  <rect x="652" y="80" width="284" height="380" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="672" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">Alternatives</text>
  <text x="672" y="150" font-family="Arial, sans-serif" font-size="11" fill="#334155">Left radial (if Allen test OK)</text>
  <text x="672" y="175" font-family="Arial, sans-serif" font-size="11" fill="#334155">Femoral (reliable for graft study)</text>
  <text x="672" y="200" font-family="Arial, sans-serif" font-size="11" fill="#334155">Brachial / ulnar rescue</text>
  <text x="672" y="240" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Pre-LHC checklist</text>
  <text x="672" y="265" font-family="Arial, sans-serif" font-size="10" fill="#334155">Op note: radial graft arm?</text>
  <text x="672" y="285" font-family="Arial, sans-serif" font-size="10" fill="#334155">Allen test both hands</text>
  <text x="672" y="305" font-family="Arial, sans-serif" font-size="10" fill="#334155">Plan LIMA angiography route</text>
</svg>
