<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="How to identify stenosis on coronary angiogram">
  <rect width="960" height="480" fill="#0b1020"/>
  <text x="24" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">Reading Stenosis on Coronary Angiography</text>
  <text x="24" y="58" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">Visual clues on fluoroscopy</text>
  <rect x="24" y="80" width="440" height="170" rx="10" fill="#111827" stroke="#16a34a" stroke-width="2"/>
  <text x="44" y="108" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#86efac">Normal vessel</text>
  <path d="M80 150 L400 150" fill="none" stroke="#f9fafb" stroke-width="14" stroke-linecap="round"/>
  <text x="44" y="180" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1">Smooth uniform lumen, TIMI 3</text>
  <rect x="496" y="80" width="440" height="170" rx="10" fill="#111827" stroke="#ef4444" stroke-width="2"/>
  <text x="516" y="108" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">Stenosis</text>
  <path d="M560 150 L700 150" fill="none" stroke="#f9fafb" stroke-width="14" stroke-linecap="round"/>
  <path d="M700 150 L730 150" fill="none" stroke="#4b5563" stroke-width="4" stroke-linecap="round"/>
  <path d="M730 150 L880 150" fill="none" stroke="#9ca3af" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="715" cy="150" rx="20" ry="13" fill="none" stroke="#ef4444" stroke-width="3"/>
  <text x="516" y="180" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1">Sudden narrowing, TIMI 1-2</text>
  <rect x="24" y="270" width="912" height="190" rx="10" fill="#111827" stroke="#374151"/>
  <text x="44" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Stenosis severity (report)</text>
  <rect x="44" y="318" width="200" height="50" rx="6" fill="#14532d" stroke="#22c55e"/>
  <text x="58" y="340" font-weight="700" font-family="Arial, sans-serif" font-size="11" fill="#86efac">under 50% mild</text>
  <rect x="260" y="318" width="200" height="50" rx="6" fill="#713f12" stroke="#f59e0b"/>
  <text x="274" y="340" font-weight="700" font-family="Arial, sans-serif" font-size="11" fill="#fcd34d">50-70% moderate</text>
  <rect x="476" y="318" width="200" height="50" rx="6" fill="#7f1d1d" stroke="#ef4444"/>
  <text x="490" y="340" font-weight="700" font-family="Arial, sans-serif" font-size="11" fill="#fca5a5">70-99% severe</text>
  <rect x="692" y="318" width="220" height="50" rx="6" fill="#450a0a" stroke="#b91c1c"/>
  <text x="706" y="340" font-weight="700" font-family="Arial, sans-serif" font-size="11" fill="#fecaca">100% / CTO</text>
  <text x="44" y="395" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">TIMI flow</text>
  <text x="44" y="415" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1">3=normal | 2=slow complete | 1=faint | 0=no distal filling</text>
  <text x="44" y="445" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Look for narrowest bright-line segment on fluoroscopy</text>
</svg>
