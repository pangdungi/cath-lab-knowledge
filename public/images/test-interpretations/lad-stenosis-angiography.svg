<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-label="LAD stenosis on LAO coronary angiogram">
  <rect width="960" height="560" fill="#0b1020"/>
  <text x="24" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">LAD Stenosis - LAO Angiogram (schematic)</text>
  <text x="24" y="58" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">Bright line = lumen | Narrow segment = stenosis (red ring)</text>
  <rect x="24" y="75" width="620" height="450" rx="12" fill="#111827" stroke="#374151" stroke-width="2"/>
  <text x="44" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">LAO view - Left coronary injection</text>
  <circle cx="320" cy="160" r="10" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
  <text x="336" y="165" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fde68a">LM</text>
  <path d="M310 168 C240 175 170 185 110 195" fill="none" stroke="#e5e7eb" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
  <path d="M310 168 C240 175 170 185 110 195" fill="none" stroke="#f9fafb" stroke-width="8" stroke-linecap="round"/>
  <text x="44" y="200" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#cbd5e1">LCX</text>
  <path d="M290 175 C250 140 210 115 170 100" fill="none" stroke="#e5e7eb" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <path d="M290 175 C250 140 210 115 170 100" fill="none" stroke="#f9fafb" stroke-width="5" stroke-linecap="round"/>
  <text x="44" y="105" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fda4af">D1</text>
  <path d="M320 172 L320 230" fill="none" stroke="#e5e7eb" stroke-width="16" stroke-linecap="round" opacity="0.85"/>
  <path d="M320 172 L320 230" fill="none" stroke="#f9fafb" stroke-width="9" stroke-linecap="round"/>
  <path d="M320 230 L320 268" fill="none" stroke="#e5e7eb" stroke-width="16" stroke-linecap="round" opacity="0.5"/>
  <path d="M320 230 L320 268" fill="none" stroke="#6b7280" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="320" cy="249" rx="22" ry="14" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="5 3"/>
  <text x="348" y="252" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fca5a5">STENOSIS</text>
  <path d="M320 268 L320 420" fill="none" stroke="#e5e7eb" stroke-width="14" stroke-linecap="round" opacity="0.7"/>
  <path d="M320 268 L320 420" fill="none" stroke="#d1d5db" stroke-width="7" stroke-linecap="round"/>
  <text x="386" y="199" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#67e8f9">pLAD</text>
  <text x="386" y="215" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">proximal - normal width</text>
  <text x="386" y="253" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fca5a5">mLAD stenosis</text>
  <text x="386" y="269" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">mid - lumen narrows here</text>
  <text x="386" y="364" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#67e8f9">dLAD</text>
  <text x="386" y="380" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">distal - delayed filling</text>
  <text x="44" y="430" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Report: mLAD 90% stenosis, TIMI 2 flow</text>
  <rect x="660" y="75" width="276" height="200" rx="12" fill="#111827" stroke="#ef4444" stroke-width="2"/>
  <text x="680" y="105" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">What stenosis looks like</text>
  <path d="M700 140 L820 140" fill="none" stroke="#f9fafb" stroke-width="12" stroke-linecap="round"/>
  <path d="M820 140 L860 140" fill="none" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/>
  <path d="M860 140 L940 140" fill="none" stroke="#d1d5db" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="840" cy="140" rx="18" ry="12" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="680" y="175" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1">Normal then sudden narrowing</text>
  <text x="680" y="195" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1">Red ring = lesion on angio</text>
  <rect x="660" y="290" width="276" height="235" rx="12" fill="#111827" stroke="#374151" stroke-width="2"/>
  <text x="680" y="320" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">LAD segments on LAO</text>
  <text x="680" y="348" font-weight="700" font-family="Arial, sans-serif" font-size="10" fill="#67e8f9">pLAD</text>
  <text x="680" y="364" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1">LM bifurcation to first branch</text>
  <text x="680" y="408" font-weight="700" font-family="Arial, sans-serif" font-size="10" fill="#fca5a5">mLAD</text>
  <text x="680" y="424" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1">Mid vessel - common stenosis site</text>
  <text x="680" y="468" font-weight="700" font-family="Arial, sans-serif" font-size="10" fill="#67e8f9">dLAD</text>
  <text x="680" y="484" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1">Beyond last branch to apex</text>
</svg>
